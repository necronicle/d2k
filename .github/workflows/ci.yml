name: CI

# Только автоматика d2k. Ничего из релизной машинерии z2k сюда не переносится
# намеренно: по §7.1 документа продукт независим, и публикация в чужой
# репозиторий не должна быть возможна даже по ошибке.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    name: C-панель — HTTP, CLI и безопасность
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Тесты C-панели и браузерного renderer
        run: make -C panel test
      - name: ASan и UBSan HTTP-handler
        run: make -C panel san

  telegram:
    name: Telegram — GCC warnings and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OpenSSL development headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - name: GCC with Wall, Wextra and Werror
        run: make -C telegram gcc-warn

  panel-browser:
    name: Chrome — panel layout regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      D2K_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: stable
      - name: Build isolated C panel
        run: make -C panel d2kpanel
      - name: Chrome rendering, controls and layout
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          D2K_CAPTURE_DIR: ${{ runner.temp }}/panel-browser/fixed
        run: |
          mkdir -p "$D2K_CAPTURE_DIR"
          node panel/test_browser.cjs 2>&1 | tee "$D2K_CAPTURE_DIR/browser.log"
      - name: Save screenshots and browser logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-chrome-layout
          path: ${{ runner.temp }}/panel-browser
          retention-days: 7
          if-no-files-found: warn

  shell:
    name: Скрипты
    # lab-install.sh ставит настоящий C runtime под ARM64: нужен ARM-раннер.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck busybox
          find scripts spike -name '*.sh' -print0 | xargs -0 -r shellcheck -s sh
          shellcheck -s sh files/d2k-instagram-dns.sh files/d2k-update.sh files/d2k-openwrt-init files/d2k-tg-firewall.sh
      - name: Автообновление — подпись, установка, возврат
        run: node scripts/test-update.cjs
      - name: OpenWrt boot bridge and installer lifecycle
        run: |
          node scripts/test-openwrt-init.cjs
          node scripts/test-runtime-install.cjs
          sh scripts/test-architecture.sh
          sh scripts/test-s99-nft.sh
          sh scripts/test-tg-firewall-nft.sh
          sh scripts/test-install-manifest.sh
      - name: Instagram resolver DNS lifecycle
        run: sh scripts/test-instagram-dns.sh
      - name: Installer/uninstaller lifecycle in disposable container
        # Контейнер не грузит модули ядра сам: netfilter-модули, которые
        # установщик требует от роутера, загружаются на хосте раннера.
        run: |
          sudo modprobe -a nfnetlink_queue xt_NFQUEUE xt_connbytes xt_multiport xt_mark xt_connmark xt_conntrack xt_addrtype xt_comment ip6table_mangle
          sh scripts/lab-install.sh

  datapath:
    name: Датапат на C — сборка под целевые арки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc gcc-aarch64-linux-gnu gcc-mipsel-linux-gnu
      - name: Тесты исполнителя планов
        run: make -C datapath check

      - name: Перенесённый Поиск по домену — дерево, адаптер и параллельные измерения
        run: make -C detect check

      - name: Датапат под целевые арки
        # Непереносимость обязана ловиться в тот день, когда её внесли, а не на
        # роутере. Запускать там нечего: ловим порядок байт, выравнивание и
        # ширину типов.
        #
        # Список файлов НЕ перечисляется здесь. Перечисленный однажды, он
        # молча разъехался с деревом: новые модули датапата в него не
        # попадали и под целевые арки не проверялись месяцами существования
        # репозитория. Список живёт в Makefile, и цель gcc-warn берёт его
        # оттуда — вместе с ТЕСТАМИ, которых в прежнем списке не было вовсе.
        run: |
          set -eu
          for cc in gcc aarch64-linux-gnu-gcc mipsel-linux-gnu-gcc; do
            echo "== $cc =="
            make -C datapath gcc-warn GCC="$cc"
          done

      - name: Измеритель этапа 0 под три арки
        # Инструмент замера, а не продуктовый датапат. Собирается здесь ради
        # того же: поймать непереносимость в день внесения.
        run: |
          set -eu
          cd spike/nfqview-c
          for cc in gcc aarch64-linux-gnu-gcc mipsel-linux-gnu-gcc; do
            echo "== $cc =="
            "$cc" -O2 -Wall -Wextra -Werror -c -o /tmp/nfqview-$cc.o nfqview.c
          done

  core:
    # Отдельное задание, параллельно датапату: тесты ядра ждут настоящих
    # сетевых таймаутов и идут ~15 минут, задерживать ими остальное незачем.
    name: Ядро на C — тесты оракула
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Тесты оракула
        # SO_MARK есть только на Linux. ubuntu-latest даёт его нативному gcc
        # без кросс-цепочек — ровно то место, где эта ветка ядра (метка на
        # зонде) вообще компилируется и исполняется в CI: на маке разработки
        # SO_MARK не определён, и локальный check его никогда не видит.
        run: make -C core check

  sanitizers:
    # «Не упало» и «не читало за буфером» — разные утверждения, а весь датапат
    # состоит из разбора чужих байтов. Под санитайзерами тесты в 2–3 раза
    # медленнее (~20 минут), поэтому они идут на main и по запросу, а не на
    # каждом pull request.
    name: Датапат и ядро под санитайзерами
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Датапат под санитайзерами
        run: make -C datapath san
      - name: Ядро под санитайзерами
        run: make -C core san
